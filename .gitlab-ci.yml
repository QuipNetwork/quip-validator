# SPDX-License-Identifier: AGPL-3.0-or-later
#
# CI pipeline for quip-protocol-rs.
#
# Stages:
#   - test:      fmt / clippy / test / runtime release build on every MR;
#                also the quip-signer PyPI wheel build + amd64 import-smoke as an
#                MR dry-run; the arm64 import-smoke runs on release tags only
#                (all three gated on QUIP_SIGNER_PUBLISH at tag time)
#   - build:     build the node and EVM-sidecar containers per architecture
#                (amd64 + arm64), each on a native runner, on release tags only
#   - manifest:  stitch each image's per-arch builds into a multi-arch manifest
#                list so a single tag serves both architectures
#   - release:   publish the quip-signer abi3 wheels + sdist to PyPI on release
#                tags via Trusted Publishing (OIDC) — TestPyPI auto, PyPI manual
#
# Triggers:
#   - merge_request_event  →  test (+ quip-signer wheel build & amd64 import-smoke, no upload)
#   - push to main         →  test
#   - push to v0.2         →  test
#   - stable git tag vX.Y.Z reachable from main
#                              →  test + build + manifest
#                                 (:<tag> + :latest + :vX.Y + :sha-*)
#   - rc / pre-release tag (or stable tag not on main)
#                              →  test + build + manifest (:<tag> + :sha-* only)
#   - release tag pipelines also run, when QUIP_SIGNER_PUBLISH is enabled:
#                              + release:build-pypi + both import-smokes
#                              + release:publish-testpypi (auto)
#                              + release:publish-pypi (manual promote)
#
# Multi-arch: kaniko has no cross-build/manifest support — it builds for the
# native architecture of whichever runner it runs on. So each architecture has
# its own kaniko job pinned to a native runner (tags: [docker, amd64] /
# [docker, arm64]) that publishes an arch-suffixed image (:<tag>-amd64 /
# :<tag>-arm64). One manifest job per image then combines those into the real
# consumer-facing tags with `manifest-tool` (buildx-free).
#
# The `docker` tag is load-bearing: it pins these jobs to *container* (Docker)
# executors, which honour `image:` and can run kaniko. The fleet also has macOS
# *shell* runners that carry the bare arch tags (amd64/arm64) but ignore
# `image:` and run on the SIP-protected host — kaniko cannot run there. Every
# runner that should accept these jobs must carry `docker`: the amd64 Linux
# Docker boxes (lovelace/finney/watch) and an arm64 Docker-executor runner
# (e.g. a docker-executor gitlab-runner hosted on an Apple-Silicon Mac).
#
# Toolchain image: docker.io/carback1/rust-substrate-builder
# (built manually from .gitlab/ci-toolchain.Dockerfile and pushed to Docker
# Hub — see the Dockerfile header for the buildx command, or run
# `make builder-image`). Rebuild it locally and re-push when the toolchain
# Dockerfile changes, then bump the pinned digest in TOOLCHAIN_IMAGE below —
# CI resolves the digest, not the tag, so a re-push alone changes nothing.
#
# Runtime images:
#   registry.gitlab.com/quip.network/quip-protocol-rs/quip-network-node:<tag>
#   registry.gitlab.com/quip.network/quip-protocol-rs/quip-network-evm-sidecar:<tag>

stages:
  - test
  - bench
  - build
  - manifest
  - release

variables:
  TOOLCHAIN_IMAGE: docker.io/carback1/rust-substrate-builder@sha256:e5ae45a0e6bac33c5b0a66d6fa291d23178d0ae1426b96073eb29de7612ee6ac
  IMAGE: $CI_REGISTRY_IMAGE/quip-network-node
  # Tagless repository: kaniko's --cache-repo must be a bare repo, not a tag
  # ref. A ':buildcache' tag here makes kaniko reject the cache destination
  # ("repository can only contain the characters ...") and silently skip every
  # cache upload, so builds never warm. The per-arch suffix is appended in the
  # build job (-> quip-network-node-buildcache-<arch>).
  CACHE_IMAGE: $CI_REGISTRY_IMAGE/quip-network-node-buildcache
  EVM_SIDECAR_IMAGE: $CI_REGISTRY_IMAGE/quip-network-evm-sidecar
  EVM_SIDECAR_CACHE_IMAGE: $CI_REGISTRY_IMAGE/quip-network-evm-sidecar-buildcache
  # Keep Cargo's registry and the workspace target/ inside the project dir so
  # the GitLab CI cache can pick them up between runs.
  CARGO_HOME: $CI_PROJECT_DIR/.cargo
  CARGO_TERM_COLOR: always
  # The quip-signer PyPI jobs run on a lean official `rust:*` image, NOT the
  # heavy Substrate TOOLCHAIN_IMAGE: the binding is its own pure-Rust workspace
  # (no clang/protoc/substrate deps), and the aarch64 wheel needs `rustup target
  # add`, which the official images guarantee. Pinned to the same Rust the rest
  # of the project builds with (RUST_VERSION in Dockerfile / ci-toolchain) — a
  # floor of 1.85 is required anyway, as edition-2024 transitive deps
  # (zeroize_derive) don't parse on older Cargo.
  PY_RELEASE_IMAGE: docker.io/library/rust:1.95.0-bookworm
  # cargo-zigbuild drives the aarch64 cross-build (zig as the linker). Pinned and
  # fetched as a prebuilt via cargo-binstall (seconds) rather than compiled from
  # source. Bump deliberately; it changes the linker the release wheels are built
  # with.
  CARGO_ZIGBUILD_VERSION: "0.22.3"
  # cargo-binstall itself is pinned and fetched as a release binary (not the
  # `curl .../main/install.sh | bash` bootstrap), so the toolchain that builds a
  # published, trust-signed wheel can't be altered by an upstream `main` change.
  CARGO_BINSTALL_VERSION: "1.20.1"
  WASM_PACK_VERSION: "0.12.1"
  # Gate for the publish jobs. They stay dormant on `v*` tags until this is set
  # to "true" in project CI/CD variables — which the maintainer does only after
  # the PyPI Trusted Publisher is configured (see docs/releasing-quip-signer.md).
  # Until then a node release tag never triggers (and so never reds on) an
  # unconfigured wheel publish.
  QUIP_SIGNER_PUBLISH: "false"
  # Expensive quantum-pow reference sweeps are manual on same-repo MRs. A
  # scheduled pipeline must explicitly override this to "true" to run them.
  QUANTUM_POW_SWEEPS: "false"

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "v0.2"
    - if: $CI_COMMIT_TAG

# Single test job: pulls the toolchain image once, restores the Cargo cache
# once, and runs fmt → clippy → test → runtime release build sequentially so
# they share compile artifacts and registry state. The toolchain image already
# has clang/protoc/cmake + the wasm32v1-none target.
cargo-test:
  stage: test
  image: $TOOLCHAIN_IMAGE
  tags: [docker, amd64]
  interruptible: true
  timeout: 90m
  cache:
    key:
      files:
        - Cargo.lock
    policy: pull-push
    paths:
      - .cargo/registry/cache
      - .cargo/registry/index
      - target/
  script:
    - cargo fmt --all -- --check
    - cargo clippy --workspace --lib --bins --tests -- -D warnings
    - cargo test --workspace --lib --bins --tests
    - cargo build --release -p quip-protocol-runtime

# Browser-facing half of the hybrid extrinsic-signing contract. This is kept
# separate from cargo-test because it additionally installs Node and the pinned
# wasm-pack release, builds browser bindings, and exercises the actual
# Polkadot.js Signer interfaces from js/quip-signer/package-lock.json.
browser-signer-test:
  stage: test
  image: $TOOLCHAIN_IMAGE
  tags: [docker, amd64]
  interruptible: true
  timeout: 90m
  cache:
    # cargo-test owns publication of the large shared target archive. Keeping
    # this consumer pull-only prevents two jobs on one runner from concurrently
    # compressing and uploading separate multi-gigabyte target caches.
    - key:
        files:
          - Cargo.lock
      policy: pull
      paths:
        - .cargo/registry/cache
        - .cargo/registry/index
        - target/
    # Browser-only tools are small and remain writable independently.
    - key:
        prefix: browser-signer-tools
        files:
          - js/quip-signer/package-lock.json
      policy: pull-push
      paths:
        - .cargo/bin/
        - .npm/
  variables:
    npm_config_cache: $CI_PROJECT_DIR/.npm
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends curl nodejs npm
    - rm -rf /var/lib/apt/lists/*
    - rustup target add wasm32-unknown-unknown
    - mkdir -p "$CARGO_HOME/bin"
    - export PATH="$CARGO_HOME/bin:$PATH"
    - |
      if ! command -v cargo-binstall >/dev/null 2>&1; then
        curl -L --proto '=https' --tlsv1.2 -sSf \
          "https://github.com/cargo-bins/cargo-binstall/releases/download/v${CARGO_BINSTALL_VERSION}/cargo-binstall-x86_64-unknown-linux-musl.tgz" |
          tar -xz -C "$CARGO_HOME/bin"
      fi
    - |
      if ! command -v wasm-pack >/dev/null 2>&1 ||
        [ "$(wasm-pack --version)" != "wasm-pack ${WASM_PACK_VERSION}" ]; then
        cargo binstall --no-confirm --locked "wasm-pack@${WASM_PACK_VERSION}"
      fi
  script:
    - cargo test -p quip-transaction-crypto-core -p quip-transaction-crypto -p quip-transaction-crypto-wasm
    - cargo test -p quip-protocol-runtime --test signing_fixture
    - cargo check -p quip-transaction-crypto-wasm --target wasm32-unknown-unknown
    - make wasm-signer
    - npm ci --prefix js/quip-signer
    - npm run typecheck --prefix js/quip-signer
    - npm test --prefix js/quip-signer
    - npm run build --prefix js/quip-signer
    - cargo build -p quip-network-node --features dev-chain-id
    - bash scripts/test-browser-signer-integration.sh

# pallet-revive's runtime benchmarks compile both Solidity/EVM and
# Solidity/PolkaVM fixtures. Keep these versions aligned with the pinned SDK's
# get-solc/get-resolc actions. They are installed per job because the current
# digest-pinned toolchain image predates pallet-revive benchmarking support.
# Both binaries are checksum-pinned: RESOLC_SHA256 comes from the release's
# official checksums.txt; solc publishes no checksum, so SOLC_SHA256 was
# pinned manually after verifying that the GitHub release artifact and
# binaries.soliditylang.org serve identical bytes.
.revive-benchmark-tooling:
  variables:
    SOLC_VERSION: "0.8.30"
    SOLC_SHA256: "f3e987dc6ecebd4bd350c48edcbc320b46cf9e3109bd3fc3d88f1acaf4c428f7"
    RESOLC_VERSION: "1.0.0"
    RESOLC_SHA256: "e626ba7a1a0d26828c14713781b0082ececc9a0fbfe984f11f0d93d66bbd7806"
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends ca-certificates curl
    - rm -rf /var/lib/apt/lists/*
    - curl -Lsf --show-error -o /usr/local/bin/solc "https://github.com/ethereum/solidity/releases/download/v${SOLC_VERSION}/solc-static-linux"
    - curl -Lsf --show-error -o /usr/local/bin/resolc "https://github.com/paritytech/revive/releases/download/v${RESOLC_VERSION}/resolc-x86_64-unknown-linux-musl"
    - echo "${SOLC_SHA256}  /usr/local/bin/solc" | sha256sum -c -
    - echo "${RESOLC_SHA256}  /usr/local/bin/resolc" | sha256sum -c -
    - chmod +x /usr/local/bin/solc /usr/local/bin/resolc
    - solc --version
    - resolc --version

# Low-resolution benchmark execution against production runtime constants.
# This is a setup/signature check, not a measurement job: output stays in a
# temporary directory and the reference-machine benchmark-weights job remains
# responsible for regenerating tracked weights.
benchmark-preflight:
  extends: .revive-benchmark-tooling
  stage: test
  image: $TOOLCHAIN_IMAGE
  tags: [docker, amd64]
  interruptible: true
  timeout: 90m
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - when: never
  cache:
    key:
      prefix: bench-preflight
      files:
        - Cargo.lock
    paths:
      - .cargo/registry/cache
      - .cargo/registry/index
      - target/
  script:
    - ./scripts/run-benchmarks.sh --check-output-resolver
    - ./scripts/check-benchmark-preflight.sh --check-wrapper-guard
    - ./scripts/check-benchmark-preflight.sh

# The Python signer crate (crates/transaction-crypto-py) is *excluded* from the
# workspace — its macOS `dynamic_lookup` link requirement would perturb the
# runtime/node builds (see the exclude comment in the root Cargo.toml). A side
# effect of that exclusion is that `cargo-test`'s `--workspace` clippy/test runs
# never compile or lint the binding, and its pytest parity suite
# (tests/test_api.py + tests/test_parity.py) otherwise only runs locally via
# `make py-signer-test`. Without this job, a change that breaks the binding's
# compilation — or its byte-for-byte parity with transaction-crypto-core — lands
# green. This job restores that coverage: it lints/format-checks the wrapper and
# runs the parity tests that back the "Python / WASM / runtime are byte-identical"
# guarantee. (It covers the in-repo wrapper; the downstream `self_test` covers a
# consumer's locally-built extension.)
py-signer-test:
  stage: test
  image: $TOOLCHAIN_IMAGE
  tags: [docker, amd64]
  interruptible: true
  timeout: 30m
  # Two caches: the shared Cargo registry (keyed on the workspace lock, same as
  # cargo-test) and the excluded crate's own target/ (it resolves against its
  # own Cargo.lock, so the workspace target/ is useless to it).
  cache:
    - key:
        files:
          - Cargo.lock
      paths:
        - .cargo/registry/cache
        - .cargo/registry/index
    - key:
        files:
          - crates/transaction-crypto-py/Cargo.lock
      paths:
        - crates/transaction-crypto-py/target/
  before_script:
    # The toolchain image is a bare rust:bookworm; `make py-signer-test` shells
    # out to `python3 -m venv` and builds a PyO3 extension via maturin, so it
    # needs the interpreter, venv module, and dev headers.
    - apt-get update && apt-get install -y --no-install-recommends python3 python3-venv python3-dev
    - rm -rf /var/lib/apt/lists/*
  script:
    - cargo fmt --manifest-path crates/transaction-crypto-py/Cargo.toml -- --check
    - cargo clippy -p quip-transaction-crypto-py --manifest-path crates/transaction-crypto-py/Cargo.toml --all-targets -- -D warnings
    - make py-signer-test

# Weight regeneration on the reference machine (QUI-857). Manual job on
# same-repo MR pipelines: a developer plays it when their change affects
# weights; it builds with runtime-benchmarks, reruns the FRAME benchmarks,
# and pushes regenerated weights.rs / benchmark_weights.rs files back to the MR branch
# as the bench bot (BENCH_PUSH_TOKEN, a bench-bot project access token).
#
# The `bench` tag is the whole point: it pins this job to the dedicated
# reference machine, and that runner carries ONLY the `bench` tag —
# deliberately not `docker`/`amd64` — so ordinary fleet jobs never land on
# the box and skew a running measurement. Its runner is registered with
# concurrent=1; resource_group additionally serializes bench jobs across
# pipelines, so benchmarks run strictly one at a time.
#
# The bot commit carries no [skip ci]: the retriggered MR pipeline is the
# compile check for wholesale-regenerated weight files. No trigger loop —
# this job is `when: manual` in that pipeline too.
#
# Cargo caches live on a host volume on the bench box (/srv/ci-cache,
# mounted at /ci-cache by the runner) instead of GitLab's tar-based cache:
# the target dir runs tens of GB. Cold build dominates the runtime (~1h);
# warm runs are much shorter. See scripts/run-benchmarks.sh for the pallet
# derivation and the pallet_quantum_pow skip rationale.
benchmark-weights:
  extends: .revive-benchmark-tooling
  stage: bench
  needs: []
  image: $TOOLCHAIN_IMAGE
  tags: [bench]
  resource_group: reference-machine
  interruptible: false
  timeout: 3h
  rules:
    # Same-repo MRs only: the push-back token must never fire for a fork.
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_SOURCE_PROJECT_ID == $CI_PROJECT_ID'
      when: manual
      allow_failure: true
  variables:
    CARGO_HOME: /ci-cache/cargo-home
    CARGO_TARGET_DIR: /ci-cache/target
    GIT_STRATEGY: clone
    GIT_DEPTH: "0"
  cache: []
  script:
    - ./scripts/run-benchmarks.sh
    - ./scripts/push-weights.sh

# Fixed-point quantum-pow calibration on node02. This job measures every point
# used by the nonlinear submit_proof model and never writes tracked weights.
# It is manual alongside benchmark-weights on same-repo MRs. Scheduled
# calibration is opt-in: set QUANTUM_POW_SWEEPS=true on the schedule.
# The manual MR job is optional so an unplayed calibration does not block a
# merge; an explicitly enabled schedule fails hard so drift alerts are visible.
#
# jq is supplied by the shared toolchain image. The sweep script keeps an
# explicit availability check and treats missing tooling or malformed/missing
# JSON as a hard failure.
benchmark-quantum-pow-sweeps:
  extends: .revive-benchmark-tooling
  stage: bench
  needs: []
  image: $TOOLCHAIN_IMAGE
  tags: [bench]
  resource_group: reference-machine
  interruptible: false
  timeout: 3h
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $QUANTUM_POW_SWEEPS == "true"'
      allow_failure: false
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_SOURCE_PROJECT_ID == $CI_PROJECT_ID'
      when: manual
      allow_failure: true
  variables:
    CARGO_HOME: /ci-cache/cargo-home
    CARGO_TARGET_DIR: /ci-cache/target
    GIT_STRATEGY: clone
    GIT_DEPTH: "0"
  cache: []
  script:
    - cargo build --release --features runtime-benchmarks,dev-chain-id -p quip-network-node
    - ./scripts/run-quantum-pow-sweeps.sh
    - test -r "$CI_PROJECT_DIR/quantum-pow-sweeps/summary.tsv"
    - QUANTUM_POW_SWEEP_SUMMARY=$CI_PROJECT_DIR/quantum-pow-sweeps/summary.tsv cargo test -p pallet-quantum-pow --lib tests::weight_covers_executed_sweep_with_ten_percent_floor -- --ignored --exact
  artifacts:
    when: always
    expire_in: 1 year
    name: "quantum-pow-sweeps-$CI_COMMIT_REF_SLUG-$CI_PIPELINE_ID"
    paths:
      - quantum-pow-sweeps/*.json
      - quantum-pow-sweeps/summary.tsv

# Reference-hardware drift check: `benchmark machine` scores the box against
# Substrate's reference hardware (CPU hash/verify rates, memory bandwidth,
# disk). Run it manually from any MR, or monthly via a scheduled pipeline
# that sets BENCH_MACHINE_CHECK=true (note: a schedule on main also runs the
# ordinary test jobs — accepted). A degradation means the box changed
# (governor unit dead, thermal issue, kernel regression) and weights should
# not be regenerated until it's understood. Uses the released node image —
# the subcommand is stable across versions; bump the tag alongside releases.
#
# --allow-fail because the reference machine (node02, SATA SSD) fails the
# two disk benches by design — ~43% seq / ~42% rnd of the NVMe-assuming
# reference at provisioning time (2026-07-22). Disk speed does not affect
# `benchmark pallet` ref_time (in-memory DB). Read the table: CPU (~130-139%
# at baseline) and memory (~110%) are the drift signals that matter.
benchmark-machine:
  stage: bench
  needs: []
  image:
    name: $IMAGE:v0.2.1
    entrypoint: [""]
  tags: [bench]
  resource_group: reference-machine
  interruptible: false
  timeout: 30m
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $BENCH_MACHINE_CHECK == "true"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual
      allow_failure: true
  script:
    - quip-network-node benchmark machine --chain quip-testnet --allow-fail

# Shared publish rules. Container images are published on release tags ONLY —
# branch pushes (main/v0.2 merges) never build or push images. Floating
# consumer tags are resolved by resolve-floating-tag: only a stable SemVer
# tag (vX.Y.Z, no pre-release suffix) whose commit is reachable from
# origin/main floats both :latest and :vX.Y; rc tags and stable tags not on
# main float nothing (only :<tag> + :sha-*). Referenced (not inherited) by
# the build jobs and the manifest job so all resolve the same PRIMARY_TAG
# for a given pipeline.
.publish-rules:
  rules:
    - if: $CI_COMMIT_TAG
      variables:
        PRIMARY_TAG: $CI_COMMIT_TAG

# Parameterized per-architecture container build. `needs: []` lets Kaniko jobs start as
# soon as the pipeline is created instead of waiting for `cargo-test` — the
# container builds are independent of the cargo lint/test suite. Image-specific
# templates provide KANIKO_CONTEXT, KANIKO_DOCKERFILE, KANIKO_IMAGE,
# KANIKO_CACHE_IMAGE, and optional whitespace-separated KANIKO_BUILD_ARGS.
# Each concrete job pins itself to a native runner and sets ARCH (amd64 also
# opts into the GPU-runner /lib workaround). Only the arch-suffixed tag
# (:<tag>-<arch>) is pushed here; consumer-facing tags are assembled later.
.kaniko-build:
  stage: build
  needs: []
  # The executor runs from a project-owned mirror of the upstream
  # gcr.io/kaniko-project/executor image. Rationale: digest-pinning a mirror
  # we control avoids gcr.io availability/rate-limit surprises and guarantees
  # the exact -debug flavor (required: GitLab before_script needs a shell,
  # absent from the non-debug image). To refresh: pull the desired upstream
  # tag, re-tag under registry.gitlab.com/quip.network/kaniko/executor, push,
  # then update the tag and sha256 digest here.
  image:
    name: registry.gitlab.com/quip.network/kaniko/executor:v1.25.17-debug@sha256:d53c54f94bf0a0733f0976a06b503814bf23f4ebc75a9b75ad683a3f528a366f
    entrypoint: [""]
  timeout: 3h
  interruptible: true
  rules: !reference [.publish-rules, rules]
  before_script:
    # GPU-runner firmware workaround — amd64 only (see KANIKO_LIB_IGNORE below).
    # The amd64 builders are NVIDIA GPU hosts that bind-mount host firmware into
    # /lib, so kaniko must --ignore-path=/lib; that drops the multilib dir, so
    # recreate it for this arch's triplet. This is NOT applied on arm64: the
    # OrbStack runner has no firmware mount, and on aarch64 the ELF interpreter
    # /lib/ld-linux-aarch64.so.1 lives directly in /lib, so ignoring /lib would
    # make every `RUN` fail with `exec /bin/sh: no such file or directory`.
    - if [ -n "$KANIKO_LIB_IGNORE" ]; then mkdir -p /lib && ln -sfn /usr/lib/$TRIPLET /lib/$TRIPLET; fi
    - mkdir -p /kaniko/.docker
    - |
      printf '{"auths":{"%s":{"auth":"%s"}}}\n' \
        "$CI_REGISTRY" \
        "$(printf '%s:%s' "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" | base64 | tr -d '\n')" \
        > /kaniko/.docker/config.json
  script:
    # --cache-repo is suffixed per arch: Kaniko's cache keys hash the build
    # instructions, not the target architecture, so amd64 and arm64 would
    # collide on identical keys but hold arch-incompatible layers if they
    # shared one cache repo.
    - |
      set -- /kaniko/executor \
        --context "$KANIKO_CONTEXT" \
        --dockerfile "$KANIKO_DOCKERFILE" \
        --destination "$KANIKO_IMAGE:$PRIMARY_TAG-$ARCH" \
        --cache=true \
        --cache-repo "$KANIKO_CACHE_IMAGE-$ARCH"
      for build_arg in $KANIKO_BUILD_ARGS; do
        set -- "$@" --build-arg "$build_arg"
      done
      for extra_arg in $KANIKO_LIB_IGNORE $KANIKO_EXTRA; do
        set -- "$@" "$extra_arg"
      done
      "$@"

.node-kaniko-build:
  extends: .kaniko-build
  variables:
    KANIKO_CONTEXT: $CI_PROJECT_DIR
    KANIKO_DOCKERFILE: $CI_PROJECT_DIR/Dockerfile
    KANIKO_IMAGE: $IMAGE
    KANIKO_CACHE_IMAGE: $CACHE_IMAGE
    KANIKO_BUILD_ARGS: SUBSTRATE_CLI_GIT_COMMIT_HASH=$CI_COMMIT_SHORT_SHA

.evm-sidecar-kaniko-build:
  extends: .kaniko-build
  variables:
    KANIKO_CONTEXT: $CI_PROJECT_DIR
    KANIKO_DOCKERFILE: $CI_PROJECT_DIR/docker/revive-eth-rpc.Dockerfile
    KANIKO_IMAGE: $EVM_SIDECAR_IMAGE
    KANIKO_CACHE_IMAGE: $EVM_SIDECAR_CACHE_IMAGE
    KANIKO_BUILD_ARGS: ""

kaniko-build-amd64:
  extends: .node-kaniko-build
  tags: [docker, amd64]
  variables:
    ARCH: amd64
    # GPU runners bind-mount firmware into /lib; ignore it + shim the multilib
    # dir (TRIPLET). arm64 deliberately sets neither — see the before_script.
    TRIPLET: x86_64-linux-gnu
    KANIKO_LIB_IGNORE: "--ignore-path=/lib"

kaniko-build-arm64:
  extends: .node-kaniko-build
  tags: [docker, arm64]
  variables:
    ARCH: arm64
    # The arm64 runner is a docker-executor on an Apple-Silicon Mac (OrbStack),
    # a far more memory/disk-constrained VM than the amd64 Linux boxes. kaniko's
    # default --compressed-caching=true holds compressed layers in RAM while
    # snapshotting the multi-GB Rust builder rootfs, which OOM-freezes the whole
    # VM (docker daemon hangs) right at "Taking snapshot of full filesystem".
    # Disable it so layers stream to disk instead of accumulating in memory.
    KANIKO_EXTRA: "--compressed-caching=false"

kaniko-build-evm-sidecar-amd64:
  extends: .evm-sidecar-kaniko-build
  tags: [docker, amd64]
  variables:
    ARCH: amd64
    TRIPLET: x86_64-linux-gnu
    KANIKO_LIB_IGNORE: "--ignore-path=/lib"

kaniko-build-evm-sidecar-arm64:
  extends: .evm-sidecar-kaniko-build
  tags: [docker, arm64]
  variables:
    ARCH: arm64
    KANIKO_EXTRA: "--compressed-caching=false"

# Maps a release tag to zero or more floating consumer tags. Tag pipelines
# carry no branch variable (CI_COMMIT_BRANCH is empty), so commit ancestry
# decides. Policy:
#   - rc / pre-release (tag does not match ^v[0-9]+\.[0-9]+\.[0-9]+$):
#     float nothing — only :<tag> + :sha-*.
#   - stable vX.Y.Z reachable from origin/main: float both :latest and
#     :vX.Y (minor series, e.g. v0.2 for v0.2.1).
#   - stable tag not reachable from origin/main: float nothing.
# GIT_DEPTH 0 forces a full clone — merge-base needs real ancestry, not a
# shallow tip. FLOATING_TAGS is space-separated (empty when none apply).
resolve-floating-tag:
  stage: build
  needs: []
  rules: !reference [.publish-rules, rules]
  image:
    name: alpine/git:latest
    entrypoint: [""]
  tags: [docker, amd64]
  interruptible: true
  variables:
    GIT_DEPTH: "0"
  script:
    - git fetch origin main
    - |
      FLOATING_TAGS=""
      if printf '%s' "$CI_COMMIT_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
        if git merge-base --is-ancestor "$CI_COMMIT_SHA" origin/main; then
          minor=$(printf '%s' "$CI_COMMIT_TAG" | sed -E 's/^(v[0-9]+\.[0-9]+).*/\1/')
          FLOATING_TAGS="latest ${minor}"
        fi
      fi
      echo "FLOATING_TAGS=$FLOATING_TAGS" > floating-tag.env
      echo "resolved FLOATING_TAGS='$FLOATING_TAGS' for $CI_COMMIT_TAG ($CI_COMMIT_SHA)"
  artifacts:
    reports:
      dotenv: floating-tag.env

# Combine one image's per-arch builds into a multi-arch manifest list. manifest-tool
# replaces the literal `ARCH` token in --template with each platform's arch
# (amd64 / arm64), matching the arch-suffixed tags the build jobs pushed, and
# stamps the assembled index with the consumer-facing tags: PRIMARY_TAG (the
# release tag), the commit-sha tag, and zero or more floating tags from
# resolve-floating-tag (:latest + :vX.Y for a stable tag on main; none for
# rc / off-main stable tags). Concrete jobs provide MANIFEST_IMAGE and their
# matching architecture-build dependencies.
.manifest-publish:
  stage: manifest
  image:
    name: mplatform/manifest-tool:alpine
    entrypoint: [""]
  tags: [docker, amd64]
  interruptible: true
  rules: !reference [.publish-rules, rules]
  script:
    - |
      ADDL_TAGS="sha-$CI_COMMIT_SHORT_SHA"
      for tag in $FLOATING_TAGS; do
        ADDL_TAGS="$ADDL_TAGS,$tag"
      done
      manifest-tool \
        --username "$CI_REGISTRY_USER" \
        --password "$CI_REGISTRY_PASSWORD" \
        push from-args \
        --platforms linux/amd64,linux/arm64 \
        --template "$MANIFEST_IMAGE:$PRIMARY_TAG-ARCH" \
        --target "$MANIFEST_IMAGE:$PRIMARY_TAG" \
        --tags "$ADDL_TAGS"

manifest:
  extends: .manifest-publish
  needs: [kaniko-build-amd64, kaniko-build-arm64, resolve-floating-tag]
  variables:
    MANIFEST_IMAGE: $IMAGE

manifest-evm-sidecar:
  extends: .manifest-publish
  needs:
    - kaniko-build-evm-sidecar-amd64
    - kaniko-build-evm-sidecar-arm64
    - resolve-floating-tag
  variables:
    MANIFEST_IMAGE: $EVM_SIDECAR_IMAGE

# ---------------------------------------------------------------------------
# quip-signer PyPI release pipeline (QUI-776)
# ---------------------------------------------------------------------------
# Publishes the quip-signer PyO3 abi3 wheels + sdist to PyPI on release tags
# via Trusted Publishing (OIDC) — no long-lived token in CI. The one-time
# PyPI- and GitLab-side setup that CI *cannot* do (creating the TestPyPI/PyPI
# projects, configuring each Trusted Publisher, the `release` environment, and
# the protected `v*` tag pattern) is documented in docs/releasing-quip-signer.md.
#
# The pipeline is build → smoke (both arches) → publish, one job per mode of
# scripts/python-dists.sh, so the cross-built aarch64 wheel is import-tested on
# a native arm64 runner before any upload (a wheel only imports on its own
# arch — one amd64 job cannot exercise both):
#   release:build-pypi         MR dry-run + release tag      build 3 artefacts + guards
#   release:smoke-pypi-amd64   MR dry-run + tag; needs build import the x86_64 wheel
#   release:smoke-pypi-arm64   release tag only; needs build import the aarch64 wheel
#   release:publish-testpypi   release tag, if PUBLISH=true  auto    → TestPyPI
#   release:publish-pypi       release tag, if PUBLISH=true  manual  → PyPI
#
# build + the amd64 smoke also run as an MR dry-run (no upload) to catch packaging
# regressions before a tag. The arm64 smoke and both publishes are tag-only — the
# arm64 runners are slow and in demand, so the aarch64 wheel is import-tested at
# tag time, not on every MR. On a release tag the whole chain is gated on
# QUIP_SIGNER_PUBLISH (off by default), so a node release tag never reds on an
# unconfigured wheel publish during Phase 1. Every pypi job `needs` only other
# pypi jobs, so the chain never waits on the container build/manifest stages
# (esp. the slow, OOM-prone arm64 kaniko job). publish `needs` both smokes, so a
# wheel that won't import on its own arch blocks the upload.
#
# Artefact matrix mirrors xquad's xqffi cdylib: abi3 wheel for linux x86_64
# (native) + abi3 wheel for linux aarch64 (cargo-zigbuild / zig linker) + an
# sdist (universal source fallback; macOS/Windows build from it). The wheel
# version is the pyproject/Cargo version, bumped per release so the tag matches.

# Tag-only rule for the pypi jobs that do NOT run as an MR dry-run: the arm64
# import-smoke and both publishes. Runs on pushed release tags like v0.2.1,
# v0.3.0-rc1, … (the same `v*` stream that releases the node container) AND only
# once publishing is enabled (QUIP_SIGNER_PUBLISH). The gate keeps an
# unconfigured publish from reding the node release pipeline during Phase 1.
.on-release-tag:
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d/ && $QUIP_SIGNER_PUBLISH == "true"

# build-pypi + the amd64 smoke additionally run as an MR dry-run (no upload) to
# catch packaging regressions before a tag is cut. The arm64 smoke is left out
# (it uses .on-release-tag) — those runners are slower and in higher demand, so
# we don't spend them on every MR; the aarch64 wheel is import-tested at tag
# time instead. On a release tag these two still require QUIP_SIGNER_PUBLISH (the
# first rule); a tag with the gate off matches nothing here and is skipped, so no
# wheel is built that will never ship.
.on-mr-or-release-tag:
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d/ && $QUIP_SIGNER_PUBLISH == "true"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# Build base: the one job that compiles. Runs on the lean Rust image (see
# PY_RELEASE_IMAGE) and installs the maturin/twine/zig toolchain. The binding is
# its own workspace resolving against its own Cargo.lock, so — like
# py-signer-test — it caches the crate's target/ keyed on that lock, not the
# workspace one. Emits dist/ as an artefact so the smoke and publish jobs consume
# the exact bytes it built (never a rebuild — the smoked wheel is the shipped
# wheel). expire_in outlasts a manual PyPI promote clicked days after the tag.
.pypi-build:
  image: $PY_RELEASE_IMAGE
  tags: [docker, amd64]
  interruptible: true
  timeout: 30m
  cache:
    - key:
        files:
          - crates/transaction-crypto-py/Cargo.lock
      paths:
        - .cargo/registry/cache
        - .cargo/registry/index
        - crates/transaction-crypto-py/target/
  artifacts:
    paths:
      - dist/
    expire_in: 1 week
  before_script:
    # maturin + twine + ziglang go in a venv placed first on PATH, so the
    # `python3` that cargo-zigbuild shells out to (`python3 -m ziglang`, how it
    # locates zig) is the venv's — the one with ziglang. A system `pip install`
    # would land in a different interpreter and zig would not be found.
    - apt-get update && apt-get install -y --no-install-recommends python3 python3-venv curl ca-certificates
    - rm -rf /var/lib/apt/lists/*
    - python3 -m venv /opt/pyrelease
    - export PATH="/opt/pyrelease/bin:$CARGO_HOME/bin:$PATH"
    - pip install --quiet --upgrade pip 'maturin>=1.7,<2' 'twine>=6.1' ziglang
    # cargo-zigbuild as a prebuilt binary via cargo-binstall (seconds) instead of
    # `cargo install` from source (minutes). cargo-binstall is fetched as a
    # version-pinned release binary (the runner is always linux amd64, so the
    # musl asset is portable) rather than the unpinned `main` bootstrap script —
    # the toolchain that builds a published wheel must be reproducible.
    - mkdir -p "$CARGO_HOME/bin"
    - curl -L --proto '=https' --tlsv1.2 -sSf "https://github.com/cargo-bins/cargo-binstall/releases/download/v${CARGO_BINSTALL_VERSION}/cargo-binstall-x86_64-unknown-linux-musl.tgz" | tar -xz -C "$CARGO_HOME/bin"
    - cargo binstall --no-confirm --locked "cargo-zigbuild@$CARGO_ZIGBUILD_VERSION"
    - rustup target add aarch64-unknown-linux-gnu
    # `cargo zigbuild` is a build subcommand with no --version flag; just
    # confirm the binstalled binary is on PATH.
    - maturin --version && twine --version && command -v cargo-zigbuild

# Smoke base: import-test one prebuilt wheel. No compile, so it drops the whole
# Rust/maturin/zig toolchain and runs on a tiny multi-arch python image — the
# same tag resolves to the amd64 or arm64 variant per runner, and `pip install`
# then picks the wheel matching that arch. The clean image is also better
# isolation than the build image: no crate source anywhere on the path to shadow
# the installed package. The concrete arch (tags:) is set on each smoke job.
.pypi-smoke:
  image: docker.io/library/python:3.12-slim-bookworm
  interruptible: true
  timeout: 15m
  needs:
    - release:build-pypi

# Publish base: mint the OIDC token and upload the prebuilt dist/. Like smoke it
# needs no Rust toolchain — just twine + curl on the small python image — and it
# consumes the artefact from build (and both smokes) rather than rebuilding, so
# the uploaded bytes are the ones that passed the smoke. Needs only the pypi
# jobs, so it never waits on the container build/manifest stages.
.pypi-publish:
  image: docker.io/library/python:3.12-slim-bookworm
  tags: [docker, amd64]
  interruptible: false
  timeout: 15m
  needs:
    - release:build-pypi
    - release:smoke-pypi-amd64
    - release:smoke-pypi-arm64
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends curl ca-certificates
    - rm -rf /var/lib/apt/lists/*
    - pip install --quiet --upgrade 'twine>=6.1'

# Build all three artefacts, guard their tags/content, twine-check metadata, and
# publish dist/ as an artefact. Runs as an MR dry-run and again on a release tag
# (when publishing is enabled) ahead of the publish jobs. No token, no upload.
# Catches release-blocking packaging regressions (bad metadata, a wheel that
# won't build, an unbuildable aarch64 cross, a dropped python surface) before a
# tag is cut.
release:build-pypi:
  extends: .pypi-build
  stage: test
  rules: !reference [.on-mr-or-release-tag, rules]
  script:
    - bash scripts/python-dists.sh build

# Import-smoke the built wheels on their native architectures — the check a file
# guard can't make (a broken extension, an ABI mismatch, a bad re-export). Each
# job installs the one wheel matching its runner arch into a throwaway venv and
# runs import + sign/verify. The aarch64 job closes the gap the amd64 runner
# leaves: the cross-built wheel that ships to Linux/aarch64 consumers is import-
# tested on real arm64 before publish. The smoke workload is featherweight
# (install a ~1 MB wheel + import), so gating on the memory-constrained arm64
# runner is safe — nothing like the Substrate compile that strains it elsewhere.
# The two jobs carry different rules on purpose: amd64 runs as an MR dry-run
# (.on-mr-or-release-tag), arm64 is tag-only (.on-release-tag) because those
# runners are slower and in higher demand — the aarch64 wheel is import-tested at
# tag time rather than on every MR.
release:smoke-pypi-amd64:
  extends: .pypi-smoke
  stage: test
  tags: [docker, amd64]
  rules: !reference [.on-mr-or-release-tag, rules]
  script:
    - bash scripts/python-dists.sh smoke

release:smoke-pypi-arm64:
  extends: .pypi-smoke
  stage: test
  tags: [docker, arm64]
  rules: !reference [.on-release-tag, rules]
  script:
    - bash scripts/python-dists.sh smoke

# Auto-publish to TestPyPI on every release tag, once publishing is enabled
# (Phase 1 validation target). Needs build + both smokes (via .pypi-publish), so
# it uploads only wheels that imported on their own arch, and still doesn't wait
# on the container build/manifest stages. No allow_failure: once enabled, a
# failed TestPyPI upload is a real signal that should red the pipeline.
release:publish-testpypi:
  extends: .pypi-publish
  stage: release
  rules: !reference [.on-release-tag, rules]
  # `environment: release` must match the environment configured on the TestPyPI
  # Trusted Publisher; PyPI rejects the OIDC exchange if they differ.
  environment: release
  # GitLab mints one short-lived JWT into PYPI_ID_TOKEN for this job. The
  # audience MUST be the literal `testpypi` (PyPI/TestPyPI reject any other aud).
  id_tokens:
    PYPI_ID_TOKEN:
      aud: testpypi
  script:
    - bash scripts/python-dists.sh publish testpypi

# Promote to production PyPI: manual button on the tag pipeline, once publishing
# is enabled. Manual + allow_failure so an un-clicked promote never reds the node
# release pipeline; click it once the TestPyPI wheel checks out. Needs build +
# both smokes (via .pypi-publish) — the promote uploads the same smoked bytes,
# read from build's artefact (expire_in: 1 week covers a promote clicked days
# later). Audience is `pypi` here (vs `testpypi` above).
release:publish-pypi:
  extends: .pypi-publish
  stage: release
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d/ && $QUIP_SIGNER_PUBLISH == "true"
      when: manual
      allow_failure: true
  environment: release
  id_tokens:
    PYPI_ID_TOKEN:
      aud: pypi
  script:
    - bash scripts/python-dists.sh publish pypi
