[workspace.package]
license = "MIT-0"
authors = ["Quip Network <roman@postquant.xyz>"]
homepage = "https://www.quip.network/"
repository = "https://gitlab.com/piqued/quip-protocol-rs.git"
edition = "2021"

[workspace]
members = [
  "crates/quantum-validation",
  "crates/transaction-crypto-core",
  "crates/transaction-crypto-wasm",
  "crates/transaction-crypto",
  "node",
  "pallets/evm-chain-id",
  "pallets/faucet-ops",
  "pallets/miner-registry",
  "pallets/quantum-compute-mempool",
  "pallets/quantum-pow",
  "pallets/template",
  "pallets/xqvm",
  "runtime",
]
# `transaction-crypto-py` is a PyO3 `extension-module` cdylib. It is excluded so
# its macOS `dynamic_lookup` link requirement (injected by maturin) never
# perturbs the runtime/node builds. It depends on `transaction-crypto-core` by
# path and is built via maturin, not as part of this workspace.
exclude = ["crates/transaction-crypto-py"]
resolver = "2"

[workspace.dependencies]
quip-protocol-runtime = { path = "./runtime", default-features = false }
pallet-evm-chain-id = { path = "./pallets/evm-chain-id", default-features = false }
pallet-faucet-ops = { path = "./pallets/faucet-ops", default-features = false }
pallet-miner-registry = { path = "./pallets/miner-registry", default-features = false }
pallet-quantum-compute-mempool = { path = "./pallets/quantum-compute-mempool", default-features = false }
pallet-quantum-pow = { path = "./pallets/quantum-pow", default-features = false }
pallet-template = { path = "./pallets/template", default-features = false }
pallet-xqvm = { path = "./pallets/xqvm", default-features = false }
quantum-validation = { path = "./crates/quantum-validation", default-features = false }
quip-transaction-crypto-core = { path = "./crates/transaction-crypto-core", default-features = false }
quip-transaction-crypto-wasm = { path = "./crates/transaction-crypto-wasm", default-features = false }
quip-transaction-crypto = { path = "./crates/transaction-crypto", default-features = false }
clap = { version = "4.5.13" }
frame-benchmarking-cli = { git = "https://github.com/QuipNetwork/polkadot-sdk.git", branch = "v0.2", default-features = false }
frame-metadata-hash-extension = { git = "https://github.com/QuipNetwork/polkadot-sdk.git", branch = "v0.2", default-features = false }
